[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations add noise on plain config dicts
    "SIM108",  # a ternary is not always clearer than an if/else
    # `class X(str, Enum)` is the shape Pydantic's docs use and serialises
    # identically; switching to StrEnum would change `str(X.member)` for no gain.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import for side effects and use bare asserts.
"tests/*" = ["B011", "F841"]
# The mock provider's task handlers share a signature they do not all use.
"app/core/llm_client.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
