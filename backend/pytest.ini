[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# A hung websocket or agent loop must fail the build, not stall it forever.
addopts = -q --strict-markers --tb=short --timeout=60 --timeout-method=thread
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    quality_gate: RAG quality metrics enforced as a CI gate
    slow: longer-running tests
