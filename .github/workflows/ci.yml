name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend — lint, tests, quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Everything runs offline against the mock provider: no API keys, no
      # Postgres service, no Redis service.
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      ENVIRONMENT: ci
      JWT_SECRET_KEY: ci-secret-not-used-in-production
      REDIS_URL: redis://127.0.0.1:6399/15
      DATABASE_URL: sqlite+aiosqlite:///./ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: |
          ruff check app scripts tests
          ruff format --check app scripts tests

      - name: Verify migrations build the schema
        run: |
          alembic upgrade head
          alembic check

      - name: Train the support classifier
        # Fails the build if held-out accuracy regresses below the floor, so a
        # bad model cannot ship silently.
        run: python -m scripts.train_classifier --min-accuracy 0.50

      - name: Tests
        run: pytest -v --timeout=120

      - name: RAG quality gate
        # Run again on its own so a quality regression is legible in the log as
        # a distinct failure rather than one red dot among many.
        run: pytest -k quality_gate -v -s

  frontend:
    name: Frontend — lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m scripts.train_classifier --quiet

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        # playwright.config.ts starts both servers itself.
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: helix-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: helix-frontend:${{ github.sha }}
          build-args: VITE_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the backend image
        run: |
          # No DATABASE_URL override: the image's own default (/data/helix.db)
          # is what a real deployment without Postgres would use, so that is
          # what the smoke test must exercise.
          docker run -d --name helix-smoke -p 8000:8000 \
            -e LLM_PROVIDER=mock \
            -e JWT_SECRET_KEY=smoke \
            helix-backend:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "backend healthy after ${i}s"
              curl -s http://localhost:8000/health
              exit 0
            fi
            sleep 1
          done

          echo "backend did not become healthy" >&2
          docker logs helix-smoke
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f helix-smoke || true
